name: Production auth URL configuration

# Inspects (and optionally extends) the hosted project's Supabase Auth URL
# settings through the Management API. "inspect" prints only non-secret
# fields; "add-redirects" only appends missing redirect URLs and never
# removes or changes anything else. SMTP credentials are never read out.
on:
  workflow_dispatch:
    inputs:
      mode:
        description: inspect or add-redirects
        type: choice
        options: [inspect, add-redirects]
        default: inspect

permissions:
  contents: read

jobs:
  auth:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SITE_URL: https://hydrunners.vercel.app
      REQUIRED_REDIRECTS: https://hydrunners.vercel.app/auth/callback,https://hydrunners.vercel.app/auth/callback**
    steps:
      - name: Check ref and project
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then echo "::error::Run from main."; exit 1; fi
          if [ "$SUPABASE_PROJECT_ID" != "nhazbqwzdxcvurdfwaos" ]; then echo "::error::Unexpected project."; exit 1; fi
      - name: Read auth URL settings (non-secret fields only)
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          curl -fsS "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -o auth.json
          jq '{site_url, uri_allow_list, mailer_otp_exp, external_email_enabled, mailer_autoconfirm,
               smtp_host, smtp_port, smtp_admin_email, smtp_sender_name,
               smtp_password_set: ((.smtp_pass // "") != ""), rate_limit_email_sent}' auth.json
      - name: Add missing redirect URLs
        if: inputs.mode == 'add-redirects'
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          current=$(jq -r '.uri_allow_list // ""' auth.json)
          site=$(jq -r '.site_url // ""' auth.json)
          if [ "$site" != "$SITE_URL" ]; then
            echo "::error::Site URL is '$site', expected $SITE_URL. Not changing it automatically."; exit 1
          fi
          merged=$(printf '%s\n%s\n' "$current" "$REQUIRED_REDIRECTS" | tr ',' '\n' | sed '/^\s*$/d' | awk '!seen[$0]++' | paste -sd, -)
          if [ "$merged" = "$current" ]; then echo "Redirect URLs already present."; exit 0; fi
          jq -n --arg list "$merged" '{uri_allow_list: $list}' > patch.json
          curl -fsS -X PATCH "https://api.supabase.com/v1/projects/$SUPABASE_PROJECT_ID/config/auth" \
            -H "Authorization: Bearer $SUPABASE_ACCESS_TOKEN" -H "Content-Type: application/json" \
            --data @patch.json -o /dev/null
          echo "uri_allow_list is now: $merged"
