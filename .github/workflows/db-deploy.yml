name: Preview production database migrations

# Previews supabase/migrations against the hosted Supabase project, which Vercel
# Production and Preview share. Manual only: merges and Vercel deployments
# never migrate the database. Credentials live in the protected "production"
# GitHub environment (configure required reviewers there). Never run `supabase db push` from
# a laptop.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "preview production" to preview pending migrations'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: db-deploy-production
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push --dry-run (production)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22

      - name: Check confirmation and configuration
        env:
          CONFIRM: ${{ inputs.confirm }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          # Only main may touch production, even before the environment's
          # branch rule is configured.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from main (got $GITHUB_REF)."; exit 1
          fi
          if [ "$CONFIRM" != "preview production" ]; then
            echo '::error::Type "preview production" in the confirm input.'; exit 1
          fi
          for name in SUPABASE_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the production environment."; exit 1
            fi
          done

      # Fails closed unless the latest "CI" run for a push to main at exactly
      # this commit completed successfully (see the script for every check).
      - name: Check CI passed for this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-gate.mjs

      - uses: supabase/setup-cli@689adcfb80d947100a1eab127289b97d1fb07b13 # v3.2.0
        with:
          version: 2.120.0
      # Secrets are passed only to the steps that talk to Supabase.
      - name: Link project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
