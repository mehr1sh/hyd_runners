name: Deploy database migrations

# Applies supabase/migrations to the hosted Supabase project, which Vercel
# Production and Preview share. Manual only: merges and Vercel deployments
# never migrate the database. Credentials live in the protected "production"
# GitHub environment (required reviewers). Never run `supabase db push` from
# a laptop.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate production" to apply migrations'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: db-deploy-production
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push (production)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check guards
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Migrations run only from main (got $GITHUB_REF)."; exit 1
          fi
          if [ "$CONFIRM" != "migrate production" ]; then
            echo '::error::Type "migrate production" in the confirm input.'; exit 1
          fi
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          if [ "$ci" -lt 1 ]; then
            echo "::error::CI has not passed for $GITHUB_SHA."; exit 1
          fi
          for name in SUPABASE_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the production environment."; exit 1
            fi
          done

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push
