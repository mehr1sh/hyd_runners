name: Deploy database migrations

# Applies supabase/migrations to the hosted project after a merge to main.
# Only this workflow pushes migrations; never run `supabase db push` from a laptop.
on:
  push:
    branches: [main]
    paths: ["supabase/migrations/**"]
  workflow_dispatch:

concurrency:
  group: db-deploy
  cancel-in-progress: false

jobs:
  push:
    runs-on: ubuntu-latest
    if: ${{ vars.SUPABASE_PROJECT_ID != '' }}
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref ${{ vars.SUPABASE_PROJECT_ID }}
      - run: supabase db push
