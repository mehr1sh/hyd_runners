name: Deploy database migrations

# Applies supabase/migrations to a hosted Supabase project. Manual only: a
# merge never migrates a database by itself. Each target is a GitHub
# environment ("staging", "production") holding its own SUPABASE_PROJECT_ID
# variable and SUPABASE_ACCESS_TOKEN / SUPABASE_DB_PASSWORD secrets; give
# "production" required reviewers. Never run `supabase db push` from a laptop.
on:
  workflow_dispatch:
    inputs:
      target:
        description: Supabase environment to migrate
        type: choice
        options: [staging, production]
        default: staging
      confirm:
        description: 'For production, type "migrate production"'
        type: string
        required: false

permissions:
  contents: read
  actions: read

concurrency:
  group: db-deploy-${{ inputs.target }}
  cancel-in-progress: false

jobs:
  push:
    name: supabase db push (${{ inputs.target }})
    runs-on: ubuntu-latest
    environment: ${{ inputs.target }}
    env:
      TARGET: ${{ inputs.target }}
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
    steps:
      - name: Check production guards
        if: inputs.target == 'production'
        env:
          GH_TOKEN: ${{ github.token }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Production migrations run only from main (got $GITHUB_REF)."; exit 1
          fi
          if [ "$CONFIRM" != "migrate production" ]; then
            echo '::error::Type "migrate production" in the confirm input.'; exit 1
          fi
          ci=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ci.yml --commit "$GITHUB_SHA" \
            --status success --json databaseId --jq length)
          if [ "$ci" -lt 1 ]; then
            echo "::error::CI has not passed for $GITHUB_SHA."; exit 1
          fi

      - name: Check environment configuration
        run: |
          for name in SUPABASE_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the '$TARGET' environment."; exit 1
            fi
          done

      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0
      - run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
      - name: Pending migrations (dry run)
        run: supabase db push --dry-run
      - name: Apply migrations
        run: supabase db push
