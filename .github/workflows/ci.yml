name: CI

on:
  pull_request:
  push:
    branches: [main, "feature/**"]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    name: Lint, typecheck, unit tests, build, e2e
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Migration versions are unique
        # Supabase tracks applied migrations by version only; a reused
        # version is silently skipped on databases that already have it.
        run: |
          dupes=$(find supabase/migrations -name '*.sql' -printf '%f\n' | cut -d_ -f1 | sort | uniq -d)
          if [ -n "$dupes" ]; then echo "::error::Duplicate migration versions: $dupes"; exit 1; fi
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test
      - name: Start local Supabase
        run: pnpm exec supabase start -x studio,imgproxy,vector,logflare,edge-runtime
      - name: Write local env
        run: |
          pnpm exec supabase status -o env | grep -E '^(API_URL|PUBLISHABLE_KEY|SECRET_KEY)=' > sb.env
          . ./sb.env
          {
            echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL"
            echo "NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=$PUBLISHABLE_KEY"
            echo "SUPABASE_SECRET_KEY=$SECRET_KEY"
            echo "NEXT_PUBLIC_SITE_URL=http://localhost:3000"
            echo "AI_PROVIDER=none"
          } > .env.local
      - name: Database tests (RLS)
        run: pnpm db:test
      - run: pnpm build
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
