name: Apply production database migrations

# Production migrations are manually triggered and require approval
# through the protected GitHub "production" environment.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "migrate production" to apply migrations'
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: db-deploy-production
  cancel-in-progress: false

jobs:
  apply:
    name: Apply Supabase migrations (production)
    runs-on: ubuntu-latest
    environment: production
    env:
      SUPABASE_PROJECT_ID: ${{ vars.SUPABASE_PROJECT_ID }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check confirmation and configuration
        env:
          CONFIRM: ${{ inputs.confirm }}
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          if [ "$CONFIRM" != "migrate production" ]; then
            echo '::error::Type "migrate production" in the confirm input.'
            exit 1
          fi

          for name in SUPABASE_PROJECT_ID SUPABASE_ACCESS_TOKEN SUPABASE_DB_PASSWORD; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not set on the production environment."
              exit 1
            fi
          done

          if [ "$SUPABASE_PROJECT_ID" != "nhazbqwzdxcvurdfwaos" ]; then
            echo "::error::Unexpected Supabase project ID."
            exit 1
          fi

      - name: Check CI passed for this commit on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/ci-gate.mjs

      - uses: supabase/setup-cli@v1
        with:
          version: 2.120.0

      - name: Link production project
        run: supabase link --project-ref "$SUPABASE_PROJECT_ID"
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Final migration preview
        run: supabase db push --dry-run
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}

      - name: Apply migrations
        run: supabase db push
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
